name: Accuracy Audit

on:
  push:
    branches:
      - audit/accuracy-2026-09-18
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run predictor backtest
        run: bun run audit/backtest.ts
