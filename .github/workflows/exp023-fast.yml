name: EXP-023 Fast Research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exp023:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run EXP-023 residual disagreement research
        run: bun run research:residual-veto
      - uses: actions/upload-artifact@v4
        with:
          name: exp-023-output
          path: |
            research/reports/exp-023.md
            research/runtime/exp-023.json
          if-no-files-found: error
