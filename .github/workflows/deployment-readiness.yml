name: Deployment Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Autoresearch synthetic acceptance tests
        run: bun run research:test

      - name: 2025 validation backtest
        run: bun run backtest

      - name: 2025 chronological evaluation with log loss, calibration, and splits
        run: bun run evaluate

      - name: EXP-006 opponent-adjusted efficiency challenger
        run: bun run research:oae

      - name: EXP-007 offense-vs-defense matchup efficiency challenger
        run: bun run research:matchup

      - name: Full failure-cluster autoresearch cycle
        run: bun run research:cycle

      - name: 2026 locked forward-style check
        run: bun run forward-test

      - name: Preserve autoresearch outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoresearch-cycle-output
          path: |
            research/runtime
            research/reports/latest.md
          if-no-files-found: warn
