name: Deployment Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exp022_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: EXP-022 structural market trust gates
        run: bun run research:structural-market

      - name: Preserve EXP-022 output
        uses: actions/upload-artifact@v4
        with:
          name: exp-022-output
          path: |
            research/reports/exp-022.md
            research/runtime/exp-022.json
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Type-check
        run: bun run typecheck

      - name: Native Node server-module loading
        run: bun run test:node-api

      - name: Production build
        run: bun run build

      - name: Point-in-time integrity regression
        run: bun run test:point-in-time

      - name: Immutable prediction-ledger regression
        run: bun run test:ledger

      - name: EXP-020 disagreement arbiter / meta-stacker
        run: bun run research:arbiter

      - name: EXP-021 early-season market disagreement gate
        run: bun run research:early-market

      - name: EXP-022 structural market trust gates
        run: bun run research:structural-market

      - name: Autoresearch synthetic acceptance tests
        run: bun run research:test

      - name: EXP-031 pregame intelligence evidence-gate tests
        run: bun run research:pregame-intelligence

      - name: DeepSeek outcome feedback and API integrity
        run: bun run test:learning

      - name: NFL training reward and dataset integrity
        run: python3 -m unittest discover -s training -p 'test_*.py'

      - name: 2025 validation backtest
        run: bun run backtest

      - name: 2025 chronological evaluation with log loss, calibration, and splits
        run: bun run evaluate

      - name: Frozen production v2.2 multi-season walk-forward
        run: bun run walk-forward

      - name: EXP-006 opponent-adjusted efficiency challenger
        run: bun run research:oae

      - name: EXP-007 offense-vs-defense matchup efficiency challenger
        run: bun run research:matchup

      - name: EXP-008 expected-margin challenger
        run: bun run research:margin

      - name: EXP-009 ridge opponent-adjusted EPA challenger
        run: bun run research:ridge-epa

      - name: EXP-010 QB EPA + CPOE challenger
        run: bun run research:qb

      - name: EXP-011 dynamic prior-season shrinkage challenger
        run: bun run research:priors

      - name: EXP-012 luck-adjusted / variance-weighted EPA challenger
        run: bun run research:wepa

      - name: EXP-013A snap-weighted personnel continuity challenger
        run: bun run research:snap-continuity

      - name: EXP-014 explosive-play + success-rate challenger
        run: bun run research:explosives

      - name: EXP-015 offensive line vs pass-rush challenger
        run: bun run research:ol-pass-rush

      - name: EXP-016A long-history play-by-play architecture benchmark
        run: bun run research:architecture

      - name: EXP-019 market-aware residual challenger
        run: bun run research:market

      - name: EXP-030 market-calibrated meta-stacker
        run: bun run research:meta-stacker

      - name: Full failure-cluster autoresearch cycle
        run: bun run research:cycle

      - name: 2026 locked forward-style check
        run: bun run forward-test

      - name: Preserve autoresearch outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoresearch-cycle-output
          path: |
            research/runtime
            research/reports/latest.md
            research/reports/production-walk-forward.md
            research/reports/exp-008.md
            research/reports/exp-009.md
            research/reports/exp-010.md
            research/reports/exp-011.md
            research/reports/exp-012.md
            research/reports/exp-013a.md
            research/reports/exp-014.md
            research/reports/exp-015.md
            research/reports/exp-016a.md
            research/reports/exp-019.md
            research/reports/exp-019.json
            research/reports/exp-030.md
            research/reports/exp-030.json
            research/reports/exp-020.md
            research/runtime/exp-020.json
            research/reports/exp-021.md
            research/runtime/exp-021.json
            research/reports/exp-022.md
            research/runtime/exp-022.json
            research/runtime/production-walk-forward.json
          if-no-files-found: warn
