name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exp031-runtime-import
          fetch-depth: 0

      - name: Add manual DeepSeek buttons without automatic calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('App.tsx')
          text = path.read_text()

          old_import = "import PredictionDisplay from './components/PredictionDisplay';\n"
          new_import = old_import + "import DeepSeekPregamePanel from './components/DeepSeekPregamePanel';\n"
          if "DeepSeekPregamePanel" not in text:
              if old_import not in text:
                  raise SystemExit('PredictionDisplay import anchor not found')
              text = text.replace(old_import, new_import, 1)

          helper_anchor = "const moneyline = (value: number) => value > 0 ? `+${value}` : String(value);\n"
          helper = """

const homeProbabilityDecimal = (result: PredictionResult, homeAbbr: string): number => {
  const finalHome = result.modelScores?.finalHomeProbability;
  if (Number.isFinite(finalHome)) return Math.max(0.001, Math.min(0.999, Number(finalHome) / 100));
  const pct = result.winner.abbr === homeAbbr ? result.confidence : 100 - result.confidence;
  return Math.max(0.001, Math.min(0.999, pct / 100));
};
"""
          if 'const homeProbabilityDecimal' not in text:
              if helper_anchor not in text:
                  raise SystemExit('moneyline helper anchor not found')
              text = text.replace(helper_anchor, helper_anchor + helper, 1)

          button_anchor = "<button onClick={() => setSelectedBatchPrediction(result)} className=\"rounded-lg border border-gray-600 bg-gray-900 hover:bg-gray-800 px-3 py-2 text-xs font-bold text-gray-200\">Full Breakdown</button>"
          button_replacement = button_anchor + """
                                  <DeepSeekPregamePanel
                                    homeTeamAbbr={game.homeTeam}
                                    awayTeamAbbr={game.awayTeam}
                                    gameDate={game.gameday}
                                    baseHomeProbability={homeProbabilityDecimal(result, game.homeTeam)}
                                    compact
                                  />"""
          if 'baseHomeProbability={homeProbabilityDecimal(result, game.homeTeam)}' not in text:
              if button_anchor not in text:
                  raise SystemExit('batch Full Breakdown anchor not found')
              text = text.replace(button_anchor, button_replacement, 1)

          manual_anchor = "{prediction && <PredictionDisplay result={prediction} />}\n"
          manual_replacement = manual_anchor + """        {prediction && (() => {
          const home = teams.find(team => team.name === homeTeam);
          const away = teams.find(team => team.name === awayTeam);
          if (!home || !away) return null;
          return (
            <DeepSeekPregamePanel
              homeTeamAbbr={home.abbr}
              awayTeamAbbr={away.abbr}
              gameDate={gameDate}
              baseHomeProbability={homeProbabilityDecimal(prediction, home.abbr)}
            />
          );
        })()}
"""
          if 'baseHomeProbability={homeProbabilityDecimal(prediction, home.abbr)}' not in text:
              if manual_anchor not in text:
                  raise SystemExit('manual PredictionDisplay anchor not found')
              text = text.replace(manual_anchor, manual_replacement, 1)

          text = text.replace(
              'Verified-data engine v2.2 + market-aware shadow',
              'Verified-data engine v2.2 + market shadow + optional DeepSeek'
          )
          text = text.replace(
              'Run the frozen pure-football control and, when a two-sided pregame moneyline exists, a separately labeled market-aware shadow model validated as EXP-019.',
              'Run the frozen football control and market-aware shadow. DeepSeek EXP-031 stays off unless you explicitly press its button, so normal predictions never spend OpenRouter credits.'
          )

          path.write_text(text)
          PY
          git config user.name "olsonan26"
          git config user.email "youwillalertme@gmail.com"
          git add App.tsx
          git commit -m "feat(exp031): make DeepSeek manual opt-in in predictor UI"
          git push origin HEAD:fix/exp031-runtime-import
