name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  final-production-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify EXP-031 production boots without a paid POST
        run: |
          code=$(curl --silent --show-error --max-time 30 --output /tmp/pregame.txt --write-out '%{http_code}' 'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' || true)
          echo "PREGAME_GET_HTTP=$code"
          cat /tmp/pregame.txt 2>/dev/null || true
          echo
          test "$code" = "405"
          grep -q "Method not allowed" /tmp/pregame.txt

      - name: Verify production CBS Week 5 top-to-bottom order
        run: |
          code=$(curl --silent --show-error --max-time 30 --output /tmp/cbs.json --write-out '%{http_code}' 'https://nflpredictor-pi.vercel.app/api/cbs-order?season=2026&week=5' || true)
          echo "CBS_GET_HTTP=$code"
          test "$code" = "200"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/cbs.json'))
          actual = [f"{g['awayTeam']}@{g['homeTeam']}" for g in data['games']]
          expected = ['TB@DAL','PHI@JAX','CIN@MIA','CHI@GB','CLE@NYJ','HOU@TEN','IND@PIT','LV@NE','MIN@NO','NYG@WAS','DEN@LAC','DET@ARI','SF@SEA','BAL@ATL','BUF@LA']
          if actual != expected:
              raise SystemExit(f"CBS production order mismatch: {actual}")
          print('CBS_PRODUCTION_ORDER=' + ' | '.join(actual))
          PY
