name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  preview-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exp031-self-contained-runtime

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Verify endpoint has no runtime service import
        run: |
          ! grep -q "pregameIntelligenceService" api/pregame-intelligence.ts
          grep -q "deepseek/deepseek-v4.1-flash" api/pregame-intelligence.ts

      - name: Verify preview function boots without a paid POST
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --max-time 30 --output /tmp/pregame.txt --write-out '%{http_code}' 'https://nflpredictor-maa7x7mxv-alex-olsons-projects-43241a84.vercel.app/api/pregame-intelligence' || true)
            echo "attempt=$attempt HTTP=$code"
            cat /tmp/pregame.txt 2>/dev/null || true
            echo
            if [ "$code" = "405" ]; then grep -q "Method not allowed" /tmp/pregame.txt && exit 0; fi
            sleep 5
          done
          exit 1
