name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production EXP-031 endpoint
        run: |
          set -u
          get_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/get.txt \
            --write-out '%{http_code}' \
            'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' || true)
          echo "GET_HTTP=$get_code"
          cat /tmp/get.txt 2>/dev/null || true
          echo

          post_code=$(curl --silent --show-error --max-time 100 \
            --output /tmp/post.txt \
            --write-out '%{http_code}' \
            -X POST 'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' \
            -H 'Content-Type: application/json' \
            --data '{"homeTeam":"KC","awayTeam":"LV","kickoffUtc":"2026-10-11T20:00:00Z","baseHomeProbability":0.55}' || true)
          echo "POST_HTTP=$post_code"
          cat /tmp/post.txt 2>/dev/null || true
          echo
