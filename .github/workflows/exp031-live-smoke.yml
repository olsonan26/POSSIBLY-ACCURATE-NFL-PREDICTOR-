name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare production API routes
        run: |
          set -u
          control_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/control.txt \
            --write-out '%{http_code}' \
            'https://nflpredictor-pi.vercel.app/api/nfl-data?dataset=games' || true)
          echo "CONTROL_HTTP=$control_code"
          head -c 200 /tmp/control.txt 2>/dev/null || true
          echo

          get_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/get.txt \
            --write-out '%{http_code}' \
            'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' || true)
          echo "PREGAME_GET_HTTP=$get_code"
          cat /tmp/get.txt 2>/dev/null || true
          echo

          post_code=$(curl --silent --show-error --max-time 100 \
            --output /tmp/post.txt \
            --write-out '%{http_code}' \
            -X POST 'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' \
            -H 'Content-Type: application/json' \
            --data '{"homeTeam":"KC","awayTeam":"LV","kickoffUtc":"2026-10-11T20:00:00Z","baseHomeProbability":0.55}' || true)
          echo "PREGAME_POST_HTTP=$post_code"
          cat /tmp/post.txt 2>/dev/null || true
          echo
