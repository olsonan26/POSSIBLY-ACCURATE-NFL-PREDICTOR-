name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production EXP-031 endpoint
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --max-time 100 \
            --output /tmp/exp031.json \
            --write-out '%{http_code}' \
            -X POST 'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' \
            -H 'Content-Type: application/json' \
            --data '{"homeTeam":"KC","awayTeam":"LV","kickoffUtc":"2026-10-11T20:00:00Z","baseHomeProbability":0.55}')
          echo "HTTP=$http_code"
          cat /tmp/exp031.json
          echo
          test "$http_code" = "200"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/exp031.json','utf8')); if(d.mode!=='shadow-only'||!d.researchModel||!d.shadow) process.exit(1); console.log('EXP031_LIVE_OK model='+d.researchModel);"
