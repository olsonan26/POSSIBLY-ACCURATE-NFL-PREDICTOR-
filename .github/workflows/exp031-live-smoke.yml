name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  validate-fix-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exp031-runtime-import

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Verify DeepSeek is manual-only in UI source
        run: |
          grep -q "Run DeepSeek Pregame Analysis" components/DeepSeekPregamePanel.tsx
          grep -q "Paid call only when pressed" components/DeepSeekPregamePanel.tsx
          grep -q "<DeepSeekPregamePanel" App.tsx
          ! grep -q "pregame-intelligence" App.tsx

      - name: Verify live CBS Week 5 order parser
        run: |
          bun -e '
            import handler from "./api/cbs-order.ts";
            let status = 200; let payload = null;
            const req = { method: "GET", query: { season: "2026", week: "5" } };
            const res = {
              setHeader() {},
              status(code) { status = code; return this; },
              json(value) { payload = value; return value; }
            };
            await handler(req, res);
            if (status !== 200) throw new Error(`CBS parser HTTP ${status}: ${JSON.stringify(payload)}`);
            const games = payload.games;
            const expected = ["TB@DAL", "PHI@JAX", "CIN@MIA", "CHI@GB", "CLE@NYJ", "HOU@TEN", "IND@PIT", "LV@NE", "MIN@NO", "NYG@WAS", "DEN@LAC", "DET@ARI", "SF@SEA", "BAL@ATL", "BUF@LA"];
            const actual = games.map(g => `${g.awayTeam}@${g.homeTeam}`);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`CBS order mismatch: ${actual.join(", ")}`);
            console.log(`CBS Week 5 order verified (${actual.length} games): ${actual.join(" | ")}`);
          '

      - name: Verify preview runtime boots without a paid DeepSeek POST
        run: |
          code=$(curl --silent --show-error --max-time 30 --output /tmp/get.txt --write-out '%{http_code}' 'https://nflpredictor-b1v65i1es-alex-olsons-projects-43241a84.vercel.app/api/pregame-intelligence' || true)
          echo "PREGAME_GET_HTTP=$code"
          cat /tmp/get.txt 2>/dev/null || true
          echo
          if [ "$code" = "500" ]; then exit 1; fi
