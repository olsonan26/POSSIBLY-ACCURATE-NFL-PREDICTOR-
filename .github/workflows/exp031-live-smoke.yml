name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production EXP-031 endpoint
        run: |
          set -u
          http_code=$(curl --silent --show-error --max-time 110 \
            --output /tmp/exp031.json \
            --write-out '%{http_code}' \
            -X POST 'https://nflpredictor-pi.vercel.app/api/pregame-intelligence' \
            -H 'Content-Type: application/json' \
            --data '{"homeTeam":"KC","awayTeam":"LV","kickoffUtc":"2026-10-11T20:00:00Z","baseHomeProbability":0.55}' || true)
          echo "HTTP=$http_code"
          cat /tmp/exp031.json 2>/dev/null || true
          echo
