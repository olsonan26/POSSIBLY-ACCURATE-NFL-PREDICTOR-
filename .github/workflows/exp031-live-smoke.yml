name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: write

jobs:
  patch-runtime-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exp031-runtime-import
          fetch-depth: 0

      - name: Convert type-only import to import type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/pregame-intelligence.ts')
          text = path.read_text()
          old = """import {\n  buildPregameShadowPrediction,\n  PREGAME_INTELLIGENCE_VERSION,\n  PregameModelPayload\n} from '../services/pregameIntelligenceService';\n"""
          new = """import {\n  buildPregameShadowPrediction,\n  PREGAME_INTELLIGENCE_VERSION\n} from '../services/pregameIntelligenceService';\nimport type { PregameModelPayload } from '../services/pregameIntelligenceService';\n"""
          if old not in text:
              raise SystemExit('Expected runtime/type mixed import not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "olsonan26"
          git config user.email "youwillalertme@gmail.com"
          git add api/pregame-intelligence.ts
          git commit -m "fix(exp031): mark payload interface as type-only import"
          git push origin HEAD:fix/exp031-runtime-import
