name: EXP-031 Live Smoke

on:
  push:
    branches:
      - smoke/exp031-live-20261004

permissions:
  contents: read

jobs:
  local-handler-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exp031-self-contained-runtime

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Verify self-contained endpoint and DeepSeek V4.1
        run: |
          ! grep -q "pregameIntelligenceService" api/pregame-intelligence.ts
          grep -q "deepseek/deepseek-v4.1-flash" api/pregame-intelligence.ts

      - name: Execute GET handler locally without OpenRouter
        run: |
          bun -e '
            import handler from "./api/pregame-intelligence.ts";
            let status = 200; let payload = null; let allow = null;
            const req = { method: "GET", body: {}, query: {} };
            const res = {
              setHeader(name, value) { if (String(name).toLowerCase() === "allow") allow = value; },
              status(code) { status = code; return this; },
              json(value) { payload = value; return value; }
            };
            await handler(req, res);
            if (status !== 405) throw new Error(`Expected 405, got ${status}`);
            if (payload?.error !== "Method not allowed") throw new Error(`Unexpected payload: ${JSON.stringify(payload)}`);
            if (allow !== "POST") throw new Error(`Unexpected Allow header: ${allow}`);
            console.log("EXP-031 self-contained GET boot passed; no OpenRouter request executed.");
          '
