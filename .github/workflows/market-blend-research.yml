name: Market Blend Research

on:
  workflow_dispatch:
  push:
    branches: [research/week1-safe-improvements]
    paths:
      - 'scripts/market-blend-research.ts'
      - 'scripts/empty-venue-research.ts'
      - 'scripts/qb-continuity-research.ts'
      - 'scripts/week1-miss-diagnostics.ts'
      - 'scripts/phase2-pregame-qb-preload.mjs'
      - '.github/workflows/market-blend-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/market-blend-research.ts
      - run: bun scripts/empty-venue-research.ts
      - run: bun --preload ./scripts/phase2-pregame-qb-preload.mjs scripts/qb-continuity-research.ts
      - run: bun scripts/week1-miss-diagnostics.ts
