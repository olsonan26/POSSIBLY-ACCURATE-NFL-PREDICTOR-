name: Football Carryover Ablation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/carryover-ablation.mjs'
      - '.github/workflows/football-carryover-ablation.yml'

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run isolated prior-season carryover ablation
        run: bun scripts/carryover-ablation.mjs
