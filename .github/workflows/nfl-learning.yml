name: Grade frozen DeepSeek forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
permissions:
  contents: read
concurrency:
  group: nfl-learning-outcomes
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NFL_LEARNING_SUPABASE_URL: ${{ secrets.NFL_LEARNING_SUPABASE_URL }}
      NFL_LEARNING_SUPABASE_KEY: ${{ secrets.NFL_LEARNING_SUPABASE_KEY }}
      OPENROUTER_PREGAME_MODEL: ${{ vars.OPENROUTER_PREGAME_MODEL || 'deepseek/deepseek-v4.1-flash' }}
    steps:
      - uses: actions/checkout@v4
        # GPU training submodule is intentionally not fetched by this worker.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Grade outcomes without paid model calls
        run: |
          if [ -z "$NFL_LEARNING_SUPABASE_URL" ] || [ -z "$NFL_LEARNING_SUPABASE_KEY" ]; then
            echo 'Learning storage secrets are missing; grading is not configured.'
            exit 1
          fi
          bun run learning:sync
