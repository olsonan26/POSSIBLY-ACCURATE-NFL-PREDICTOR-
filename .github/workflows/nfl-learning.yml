name: Capture and grade NFL research evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: nfl-learning-outcomes
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NFL_LEARNING_SUPABASE_URL: ${{ secrets.NFL_LEARNING_SUPABASE_URL }}
      NFL_LEARNING_SUPABASE_KEY: ${{ secrets.NFL_LEARNING_SUPABASE_KEY }}
      NFL_LEARNING_SECRET: ${{ secrets.NFL_LEARNING_SECRET }}
      NFL_LEDGER_SUPABASE_URL: ${{ secrets.NFL_LEDGER_SUPABASE_URL }}
      NFL_LEDGER_SUPABASE_KEY: ${{ secrets.NFL_LEDGER_SUPABASE_KEY }}
      NFL_LEDGER_SECRET: ${{ secrets.NFL_LEDGER_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NFL_RESEARCH_ACCESS_KEY: ${{ secrets.NFL_RESEARCH_ACCESS_KEY }}
      OPENROUTER_PREGAME_MODEL: ${{ vars.OPENROUTER_PREGAME_MODEL || 'deepseek/deepseek-v4.1-flash' }}
    steps:
      - uses: actions/checkout@v4
        # GPU training submodule is intentionally not fetched by this worker.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture due horizons, resume backfills and perform daily grading/research
        run: |
          if [ -z "$NFL_LEARNING_SUPABASE_URL" ] || [ -z "$NFL_LEARNING_SUPABASE_KEY" ]; then
            echo '::error::Automatic forward capture is BLOCKED_CONFIGURATION: server storage credentials are missing.'
            exit 1
          fi
          bun run research:worker
