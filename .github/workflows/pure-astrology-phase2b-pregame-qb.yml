name: PURE Astrology Phase 2B Pregame QB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pure-astrology-phase2.mjs'
      - 'scripts/phase2-preload.mjs'
      - 'scripts/phase2-pregame-qb-preload.mjs'
      - '.github/workflows/pure-astrology-phase2b-pregame-qb.yml'

permissions:
  contents: read

jobs:
  phase2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install Astronomy Engine for isolated research run
        run: bun add --no-save astronomy-engine@2.1.19

      - name: Run Phase 2B with archived pregame QB depth charts
        run: >-
          bun
          --preload ./scripts/phase2-preload.mjs
          --preload ./scripts/phase2-pregame-qb-preload.mjs
          scripts/pure-astrology-phase2.mjs
