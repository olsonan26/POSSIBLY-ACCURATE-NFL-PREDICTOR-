name: PURE Astrology Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pure-astrology-research.mjs'
      - 'data/teamRegistry.ts'
      - '.github/workflows/pure-astrology-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install Astronomy Engine for isolated research run
        run: bun add --no-save astronomy-engine@2.1.19

      - name: Run leakage-safe PURE Astrology experiment
        run: bun scripts/pure-astrology-research.mjs
