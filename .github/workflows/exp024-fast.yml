name: EXP-024 Fast Research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exp024:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run EXP-024 disagreement specialist
        run: bun scripts/disagreement-specialist.ts
      - uses: actions/upload-artifact@v4
        with:
          name: exp-024-output
          path: |
            research/reports/exp-024.md
            research/runtime/exp-024.json
          if-no-files-found: error
